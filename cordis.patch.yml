# dsh-insights — bundle layer
#
# One Loader entry per package (the dsh client module system rejects multiple
# active sources resolving to one package name), so the single `insights`
# entry carries host apply (webServer 上的 /dsh-insights 只读路由), and the
# same enabled entry's `dsh.client` metadata makes the browser load the
# ./client face (侧栏底部 ✦ 动作 + shell.overlay「生态」面板：体检已装插件 /
# 查验健康分 / 场景发现).
- insert:
    - id: insights
      name: dsh-insights-kit
